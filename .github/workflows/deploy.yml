name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            if [ ! -d .git ]; then
              git clone https://github.com/MattBortsov/molniya.git .
            fi
            git fetch origin
            git reset --hard origin/main
            if [ ! -f .env ] || ! grep -Eq '^OPENROUTER_API_KEY=.+' .env; then
              echo 'OPENROUTER_API_KEY is missing from the server .env'
              exit 1
            fi
            if ! grep -Eq '^SEOSMITH_WEBHOOK_SECRET=.+' .env; then
              echo 'SEOSMITH_WEBHOOK_SECRET is missing from the server .env'
              exit 1
            fi
            docker compose build
            docker compose up -d
            for attempt in 1 2 3 4 5; do
              if docker exec molniya-api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"business":"Студия маникюра с записью клиентов по времени","website":""}' http://127.0.0.1:8090/api/industry-fit)
            if [ "$status" != '200' ]; then
              echo "Jev smoke check failed with HTTP $status"
              exit 1
            fi
            blog_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/blog)
            sitemap_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/sitemap.xml)
            robots_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/robots.txt)
            notfound_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/non-existent-page-check-404)
            webhook_status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"event":"test"}' http://127.0.0.1:8090/api/seosmith)
            if [ "$blog_status" != '200' ] || [ "$sitemap_status" != '200' ] || [ "$robots_status" != '200' ] || [ "$notfound_status" != '404' ] || [ "$webhook_status" != '401' ]; then
              echo "Smoke check failed: blog=$blog_status sitemap=$sitemap_status robots=$robots_status 404=$notfound_status unsigned_webhook=$webhook_status"
              exit 1
            fi
