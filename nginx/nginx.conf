limit_req_zone $binary_remote_addr zone=molniya_ai_limit:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security_headers.conf;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # The project directory is mounted as the web root. Never serve secrets or source.
    location ~ /\. { return 404; }
    location ^~ /nginx/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /api/ { return 404; }

    # Fonts and images — long cache, filenames are stable
    location /fonts/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Blog — clean URL, no trailing slash
    location = /blog  { try_files /blog/index.html =404; }
    location = /blog/ { return 301 /blog; }

    location /blog/ {
        try_files $uri $uri.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /api/industry-fit {
        limit_req zone=molniya_ai_limit burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/industry-fit;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
