limit_req_zone $binary_remote_addr zone=molniya_ai_limit:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security_headers.conf;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # The project directory is mounted as the web root. Never serve secrets or source.
    location ~ /\. { return 404; }
    location ^~ /nginx/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /api/ { return 404; }

    # Fonts and images — long cache, filenames are stable
    location /fonts/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Published HTML is generated by the webhook and served directly from the volume.
    location = /blog {
        root /var/www;
        try_files /blog/index.html =404;
        expires -1;
    }
    location = /blog/ { return 301 /blog; }

    location /blog/ {
        root /var/www;
        try_files $uri $uri.html @blog_legacy;
        expires -1;
    }

    location @blog_legacy {
        proxy_intercept_errors on;
        proxy_pass http://api:8080;
    }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
        expires 1d;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        try_files /favicon.svg =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /sitemap.xml {
        root /var/www/blog;
        try_files /sitemap.xml =404;
        expires -1;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /api/industry-fit {
        limit_req zone=molniya_ai_limit burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/industry-fit;
    }

    location = /api/seosmith {
        client_max_body_size 2m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/seosmith;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
