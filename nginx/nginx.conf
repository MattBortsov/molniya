limit_req_zone $binary_remote_addr zone=molniya_ai_limit:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/security_headers.conf;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # The project directory is mounted as the web root. Never serve secrets or source.
    location ~ /\. { return 404; }
    location ^~ /nginx/ { return 404; }
    location ^~ /scripts/ { return 404; }
    location ^~ /api/ { return 404; }

    # Fonts and images — long cache, filenames are stable
    location /fonts/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Published HTML is generated by the webhook and served directly from the volume.
    location = /blog {
        root /var/www;
        try_files /blog/index.html =404;
        expires -1;
    }
    location = /blog/ { return 301 /blog; }

    location /blog/ {
        root /var/www;
        try_files $uri $uri.html @blog_legacy;
        expires -1;
    }

    location @blog_legacy {
        proxy_intercept_errors on;
        proxy_pass http://api:8080;
    }

    location = /requisites.html { return 301 /requisites; }
    location = /about.html { return 301 /about; }
    location = /auto.html { return 301 /auto; }
    location = /beauty.html { return 301 /beauty; }
    location = /health.html { return 301 /health; }
    location = /psychologist.html { return 301 /psychologist; }
    location = /stretching.html { return 301 /stretching; }
    location = /yoga.html { return 301 /yoga; }
    location = /trainers.html { return 301 /trainers; }
    location = /martial-arts.html { return 301 /martial-arts; }
    location = /spaces.html { return 301 /spaces; }
    location = /photostudios.html { return 301 /photostudios; }
    location = /quests.html { return 301 /quests; }
    location = /vr-arena.html { return 301 /vr-arena; }
    location = /karting.html { return 301 /karting; }
    location = /anticafe.html { return 301 /anticafe; }
    location = /saunas.html { return 301 /saunas; }
    location = /glamping.html { return 301 /glamping; }
    location = /furniture-cleaning.html { return 301 /furniture-cleaning; }
    location = /window-cleaning.html { return 301 /window-cleaning; }
    location = /pest-control.html { return 301 /pest-control; }
    location = /cleaning.html { return 301 /cleaning; }
    location = /education.html { return 301 /education; }
    location = /pets.html { return 301 /pets; }
    location = /repair.html { return 301 /repair; }
    location = /pricing.html { return 301 /pricing; }
    location = /dikidi.html { return 301 /dikidi; }
    location = /yclients.html { return 301 /yclients; }
    location = /privacy.html { return 301 /privacy; }
    location = /thanks.html { return 301 /thanks; }
    # Tools Hub and Tools Subpages
    location = /tools {
        try_files /tools/index.html /tools.html =404;
    }
    location = /tools/ { return 301 /tools; }
    location /tools/ {
        try_files $uri $uri.html =404;
    }

    # Clean redirects for .html under /tools/
    location = /tools/calendar.html { return 301 /tools/calendar; }
    location = /tools/inn.html { return 301 /tools/inn; }
    location = /tools/margin.html { return 301 /tools/margin; }
    location = /tools/carwash-weather.html { return 301 /tools/carwash-weather; }
    location = /tools/qr.html { return 301 /tools/qr; }
    location = /tools/salary.html { return 301 /tools/salary; }
    location = /tools/pricelist.html { return 301 /tools/pricelist; }
    location = /tools/acquiring.html { return 301 /tools/acquiring; }
    location = /tools/shifts.html { return 301 /tools/shifts; }

    # 301-redirects from legacy top-level tool URLs to /tools/<slug>
    location = /calendar { return 301 /tools/calendar; }
    location = /calendar.html { return 301 /tools/calendar; }
    location = /inn { return 301 /tools/inn; }
    location = /inn.html { return 301 /tools/inn; }
    location = /margin { return 301 /tools/margin; }
    location = /margin.html { return 301 /tools/margin; }
    location = /carwash-weather { return 301 /tools/carwash-weather; }
    location = /carwash-weather.html { return 301 /tools/carwash-weather; }
    location = /weather { return 301 /tools/carwash-weather; }
    location = /weather.html { return 301 /tools/carwash-weather; }
    location = /qr { return 301 /tools/qr; }
    location = /qr.html { return 301 /tools/qr; }
    location = /salary { return 301 /tools/salary; }
    location = /salary.html { return 301 /tools/salary; }
    location = /pricelist { return 301 /tools/pricelist; }
    location = /pricelist.html { return 301 /tools/pricelist; }
    location = /acquiring { return 301 /tools/acquiring; }
    location = /acquiring.html { return 301 /tools/acquiring; }
    location = /shifts { return 301 /tools/shifts; }
    location = /shifts.html { return 301 /tools/shifts; }
    location = /tools.html { return 301 /tools; }
    location = /cookies.html { return 301 /privacy; }
    location = /cookies { return 301 /privacy; }

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
        expires 1d;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        try_files /favicon.svg =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location = /sitemap.xml {
        root /var/www/blog;
        try_files /sitemap.xml =404;
        expires -1;
    }

    location = /rss.xml {
        root /usr/share/nginx/html;
        try_files /rss.xml =404;
        default_type application/rss+xml;
        charset utf-8;
        expires 1h;
    }

    location = /feed.xml { return 301 /rss.xml; }
    location = /rss { return 301 /rss.xml; }
    location = /feed { return 301 /rss.xml; }

    location = / {
        try_files /index.html =404;
    }

    location = /api/industry-fit {
        limit_req zone=molniya_ai_limit burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/industry-fit;
    }

    location = /api/lead {
        client_max_body_size 2k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/lead;
    }

    location = /api/calendar {
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/calendar;
    }

    location = /api/inn {
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/inn;
    }

    location = /api/inn/pdf {
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/inn/pdf;
    }

    location = /api/weather {
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/weather;
    }

    location = /api/weather/cities {
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/weather/cities;
    }

    location = /api/seosmith {
        client_max_body_size 2m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://api:8080/api/seosmith;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
