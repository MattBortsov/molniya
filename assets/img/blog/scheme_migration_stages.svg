<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24262c"/>
      <stop offset="100%" stop-color="#1b1c21"/>
    </linearGradient>
    <linearGradient id="numGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D2634A"/>
      <stop offset="100%" stop-color="#F1AC71"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="20" fill="url(#bgGrad3)"/>
  <rect width="898" height="478" x="1" y="1" rx="19" fill="none" stroke="#333742" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="45" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4 этапа миграции из Excel в CRM без сбоев</text>
  <text x="45" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#9AA4B2">Пошаговый регламент перехода на платформу «Молния» без остановки работы сервиса</text>

  <!-- 4 Step Cards in a row or 2x2 grid -->
  <!-- Step 1 -->
  <g transform="translate(45, 105)">
    <rect width="185" height="320" rx="14" fill="url(#stepGrad)" stroke="#353945" stroke-width="1.2" filter="url(#shadow3)"/>
    <!-- Number Badge -->
    <rect x="20" y="20" width="38" height="38" rx="10" fill="url(#numGrad1)"/>
    <text x="39" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Гигиена</text>
    <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">данных</text>

    <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F1AC71">Время: ~30 мин</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3" width="145">
      • Приведение номеров к 11 цифрам
    </text>
    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Склейка дублей клиентов
    </text>
    <text x="20" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Разделение ФИО и авто в отдельные колонки
    </text>
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Удаление мусорных пустых строк
    </text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(250, 105)">
    <rect width="185" height="320" rx="14" fill="url(#stepGrad)" stroke="#353945" stroke-width="1.2" filter="url(#shadow3)"/>
    <rect x="20" y="20" width="38" height="38" rx="10" fill="url(#numGrad1)"/>
    <text x="39" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Каталог</text>
    <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">и посты</text>

    <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F1AC71">Время: ~40 мин</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Ввод чистых услуг с длительностями
    </text>
    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Коэффициенты по классам авто
    </text>
    <text x="20" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Привязка работ к конкретным боксам
    </text>
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Настройка прав доступа персонала
    </text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(455, 105)">
    <rect width="185" height="320" rx="14" fill="url(#stepGrad)" stroke="#353945" stroke-width="1.2" filter="url(#shadow3)"/>
    <rect x="20" y="20" width="38" height="38" rx="10" fill="url(#numGrad1)"/>
    <text x="39" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Бесшовный</text>
    <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">вечер</text>

    <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F1AC71">Время: ~1.5 часа</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Автоимпорт базы клиентов за 1 клик
    </text>
    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Ручной перенос броней на 10–14 дней
    </text>
    <text x="20" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Сверка боксов и телефонов клиентов
    </text>
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Отправка Telegram-подтверждений
    </text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(660, 105)">
    <rect width="195" height="320" rx="14" fill="url(#stepGrad)" stroke="#2ECC71" stroke-width="1.3" filter="url(#shadow3)"/>
    <rect x="20" y="20" width="38" height="38" rx="10" fill="#2ECC71"/>
    <text x="39" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Уверенный</text>
    <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#2ECC71">старт</text>

    <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#52C41A">Утро следующего дня</text>

    <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Таблица Excel закрыта в Read-Only
    </text>
    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Администратор ведет календарь в CRM
    </text>
    <text x="20" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#B0B7C3">
      • Мастера видят свои наряды в телефоне
    </text>
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#52C41A">
      • Ноль потерянных записей!
    </text>
  </g>
</svg>
