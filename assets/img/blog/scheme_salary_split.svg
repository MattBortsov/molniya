<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24262c"/>
      <stop offset="100%" stop-color="#1c1d22"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D2634A"/>
      <stop offset="100%" stop-color="#F1AC71"/>
    </linearGradient>
    <linearGradient id="greenGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#2ECC71"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="20" fill="url(#bgGrad2)"/>
  <rect width="898" height="478" x="1" y="1" rx="19" fill="none" stroke="#333742" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="45" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Разделение чека в CRM: как спасти прибыль сервиса</text>
  <text x="45" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#9AA4B2">Пример заказ-наряда на керамическое покрытие кузова (сумма чека: 25 000 ₽)</text>

  <!-- Two comparison columns -->
  <!-- Left column: Mistake -->
  <g transform="translate(45, 105)">
    <rect width="390" height="335" rx="14" fill="url(#cardGrad2)" stroke="#4A2525" stroke-width="1.2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="390" height="44" rx="14" fill="#321A1A"/>
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FF7875">❌ Ошибка: начисление % с общей суммы</text>

    <!-- Formula breakdown -->
    <text x="24" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">Общий чек клиента:</text>
    <text x="366" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">25 000 ₽</text>

    <line x1="24" y1="90" x2="366" y2="90" stroke="#343844" stroke-width="1"/>

    <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">Закупка автохимии / состава:</text>
    <text x="366" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#CFD3DC" text-anchor="end">15 000 ₽</text>

    <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">Ставка мастера (30% от чека):</text>
    <text x="366" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FF4D4F" text-anchor="end">7 500 ₽</text>

    <!-- Result Box -->
    <rect x="24" y="175" width="342" height="75" rx="10" fill="#301A1A" stroke="#E74C3C" stroke-width="1"/>
    <text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFA39E">Остаток сервису на аренду и прибыль:</text>
    <text x="40" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FF4D4F">2 500 ₽ (10%)</text>

    <text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#D87A7A">
      Мастер забрал процент с дорогой химии.
    </text>
    <text x="24" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#D87A7A">
      Прибыль сервиса съедена, возникает кассовый разрыв.
    </text>
  </g>

  <!-- Right column: Correct in Molniya -->
  <g transform="translate(465, 105)">
    <rect width="390" height="335" rx="14" fill="url(#cardGrad2)" stroke="#1F4229" stroke-width="1.2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="390" height="44" rx="14" fill="#142C1B"/>
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#52C41A">✓ Правильно: разделение чека в «Молнии»</text>

    <!-- Formula breakdown -->
    <text x="24" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">1. Химия / материалы (0% мастеру):</text>
    <text x="366" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">15 000 ₽</text>

    <line x1="24" y1="90" x2="366" y2="90" stroke="#343844" stroke-width="1"/>

    <text x="24" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">2. Трудоемкость операции:</text>
    <text x="366" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#CFD3DC" text-anchor="end">10 000 ₽</text>

    <text x="24" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#9AA4B2">Ставка мастера (40% от работы):</text>
    <text x="366" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#52C41A" text-anchor="end">4 000 ₽</text>

    <!-- Result Box -->
    <rect x="24" y="175" width="342" height="75" rx="10" fill="#142C1B" stroke="#2ECC71" stroke-width="1"/>
    <text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#B7EB8F">Остаток сервису на аренду и прибыль:</text>
    <text x="40" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#52C41A">6 000 ₽ (24%)</text>

    <text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8CE165">
      Мастер получил щедрые 40% за свой личный труд.
    </text>
    <text x="24" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8CE165">
      Сервис защитил себестоимость химии и сохранил прибыль.
    </text>
  </g>
</svg>
