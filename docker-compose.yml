# Static site, served on a dedicated host port so it never collides with
# another nginx (e.g. SEOSmith) already bound to 80/443 on the same server.
# Also joins the shared `edge` network so SEOSmith's nginx can reach it by
# container name (molniya-nginx:80) and terminate TLS for molniya-tech.ru.
name: molniya
services:
  nginx:
    image: nginx:alpine
    container_name: molniya-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - default
      - edge
    depends_on:
      - api
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: python:3.12-alpine
    container_name: molniya-api
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-typesafe/jev-1.13}
    command: ["python", "/app/server.py"]
    expose:
      - "8080"
    networks:
      - default
    volumes:
      - ./api:/app:ro
    tmpfs:
      - /tmp:size=8m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: edge
    external: true
